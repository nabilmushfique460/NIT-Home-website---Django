{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="background: #ffffff; color: #1f2937;">
        <div class="auth-header">
            <svg width="40" height="40" viewBox="0 0 24 24" style="margin: 0 auto 12px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <h1 class="auth-title" style="color: #111827; font-size: 1.4rem;">Sign in with Google</h1>
            <p class="auth-subtitle" style="color: #4b5563;">Choose or simulate an account to continue to <strong>N-IT Home</strong></p>
        </div>

        <form method="post" action="{% url 'accounts:google_oauth' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" style="color: #374151;">Google Account Email</label>
                <input type="email" name="email" value="alex.builder@gmail.com" class="form-input" style="background: #ffffff; color: #111827; border-color: #d1d5db;" required>
            </div>

            <div class="form-group">
                <label class="form-label" style="color: #374151;">Account Display Name</label>
                <input type="text" name="full_name" value="Alex Builder" class="form-input" style="background: #ffffff; color: #111827; border-color: #d1d5db;" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="background: #1a73e8; color: #ffffff; border: none; font-weight: 700; padding: 12px;">
                Authorize N-IT Home
            </button>
        </form>

        <div style="margin-top: 18px; text-align: center;">
            <a href="{% url 'accounts:login' %}" style="font-size: 0.85rem; color: #6b7280;">Cancel authorization</a>
        </div>
    </div>
</div>
{% endblock %}
