{% extends 'base.html' %}

{% block content %}
<div class="wrap" style="padding-top: 40px; padding-bottom: 56px;">
    <div style="max-width: 480px; margin: 0 auto;">

        <div class="nagad-gateway-box">
            <div class="nagad-gateway-header">
                <div class="nagad-logo-text">Nagad</div>
                <div style="font-size: 13px; color: var(--text-dim); margin-top: 4px;">Direct Payment Gateway Simulator</div>
            </div>

            <div class="nagad-gateway-body">
                <div style="background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; text-align: center;">
                    <div style="font-size: 12.5px; color: var(--text-faint);">Merchant: TRACEFORGE Labs</div>
                    <div style="font-size: 12.5px; color: var(--text-dim); margin: 4px 0;">Order Ref: #{{ order.order_number }}</div>
                    <div class="mono" style="font-size: 2rem; font-weight: 700; color: var(--copper-bright);">
                        ${{ payment.amount }}
                    </div>
                </div>

                <form method="post" action="{% url 'payments:nagad_callback' transaction_id=payment.transaction_id %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label class="form-label">Nagad Registered Account Number</label>
                        <input type="text" name="wallet_number" value="01812345678" class="form-input" placeholder="e.g. 01XXXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Verification OTP (Simulation: Enter 123456)</label>
                        <input type="text" name="otp" value="123456" class="form-input" placeholder="6-digit OTP" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nagad PIN (Simulation: Enter 1234)</label>
                        <input type="password" name="pin" value="1234" class="form-input" placeholder="4-digit PIN" required>
                    </div>

                    <button type="submit" class="nagad-btn-submit">
                        Authorize Payment ${{ payment.amount }} &rarr;
                    </button>
                </form>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="{% url 'orders:order_detail' order_number=order.order_number %}" style="font-size: 13px; color: var(--text-faint);">Cancel Transaction &amp; Return</a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
