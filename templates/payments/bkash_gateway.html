{% extends 'base.html' %}

{% block content %}
<div class="wrap" style="padding-top: 56px; padding-bottom: 72px;">
    <div style="max-width: 560px; margin: 0 auto; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 48px 32px;">
        <div style="font-size: 2.5rem; font-weight: 800; color: #e11471; margin-bottom: 16px;">
            bKash
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.4;">
            Bkash payment will be available soon !<br>Thank You
        </h2>
        <p style="color: var(--text-dim); font-size: 14.5px; margin-bottom: 28px; line-height: 1.6;">
            Order reference <strong style="color: var(--copper-bright);">#{{ order.order_number }}</strong> has been recorded.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'payments:payment_select' order_number=order.order_number %}" class="btn-solid lg">&larr; Back to Payment</a>
            <a href="{% url 'orders:order_detail' order_number=order.order_number %}" class="btn-outline lg">View Order Manifest</a>
        </div>
    </div>
</div>
{% endblock %}
