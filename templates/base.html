{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} | {% endif %}N-IT HOME — Build without bottlenecks</title>
    <meta name="description" content="N-IT HOME PC Hardware — Every GPU, CPU, memory kit, and drive we sell is burned in on our own test bench before it reaches yours.">
    <meta name="theme-color" content="#FBF8F3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/gallery.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>

    <input type="checkbox" id="mobile-nav-toggle" aria-hidden="true">

    {% include 'includes/navbar.html' %}

    <main class="main-content">
        <div class="wrap">
            {% include 'includes/messages.html' %}
        </div>
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script>
        document.documentElement.classList.add('js');
        const menuBtn = document.getElementById('menuBtn');
        const mega = document.getElementById('megaMenu');
        if (menuBtn && mega) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const open = mega.classList.toggle('open');
                menuBtn.setAttribute('aria-expanded', open);
            });
            document.addEventListener('click', (e) => {
                if (!mega.contains(e.target) && !menuBtn.contains(e.target)) {
                    mega.classList.remove('open');
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    mega.classList.remove('open');
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
            });
        }
        const revealEls = document.querySelectorAll('.reveal');
        if ('IntersectionObserver' in window && revealEls.length) {
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12 });
            revealEls.forEach(el => io.observe(el));
        } else {
            revealEls.forEach(el => el.classList.add('in-view'));
        }
        const nums = document.querySelectorAll('.stat .num');
        if ('IntersectionObserver' in window && nums.length) {
            const countIo = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const target = parseFloat(el.dataset.target);
                        const decimals = parseInt(el.dataset.decimals || '0');
                        const duration = 1400;
                        const start = performance.now();
                        function tick(now){
                            const p = Math.min((now - start) / duration, 1);
                            const eased = 1 - Math.pow(1 - p, 3);
                            const val = target * eased;
                            el.textContent = val.toFixed(decimals);
                            if (p < 1) requestAnimationFrame(tick);
                        }
                        requestAnimationFrame(tick);
                        countIo.unobserve(el);
                    }
                });
            }, { threshold: 0.5 });
            nums.forEach(el => countIo.observe(el));
        }
        const schematic = document.querySelector('.schematic');
        const heroVisual = document.querySelector('.hero-visual');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (heroVisual && schematic && !reduceMotion && window.matchMedia('(hover:hover)').matches) {
            heroVisual.addEventListener('mousemove', (e) => {
                const rect = heroVisual.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                schematic.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            });
            heroVisual.addEventListener('mouseleave', () => {
                schematic.style.transform = 'translate(0,0)';
            });
            schematic.style.transition = 'transform .35s ease-out';
        }
        const newsForm = document.getElementById('newsForm');
        const newsNote = document.getElementById('newsNote');
        if (newsForm && newsNote) {
            newsForm.addEventListener('submit', (e) => {
                e.preventDefault();
                newsNote.textContent = "You're on the list — we'll email you at restock.";
                newsNote.classList.add('ok');
                newsForm.reset();
            });
        }

        // Hardware Filter Matrix Modal Controller
        const navFilterBtn = document.getElementById('navFilterBtn');
        const mobileFilterBtn = document.getElementById('mobileFilterBtn');
        const pageFilterBtn = document.getElementById('pageFilterBtn');
        const filterOverlay = document.getElementById('filterMatrixOverlay');
        const filterBackdrop = document.getElementById('filterMatrixBackdrop');
        const filterCloseBtn = document.getElementById('filterModalCloseBtn');

        function openFilterModal() {
            if (filterOverlay) {
                filterOverlay.style.display = 'flex';
                requestAnimationFrame(() => {
                    filterOverlay.classList.add('is-open');
                    filterOverlay.setAttribute('aria-hidden', 'false');
                });
                if (navFilterBtn) {
                    navFilterBtn.classList.add('is-active');
                    navFilterBtn.setAttribute('aria-expanded', 'true');
                }
                document.body.classList.add('filter-modal-locked');

                const mobileToggle = document.getElementById('mobile-nav-toggle');
                if (mobileToggle && mobileToggle.checked) {
                    mobileToggle.checked = false;
                }

                if (mega && menuBtn) {
                    mega.classList.remove('open');
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
            }
        }

        function closeFilterModal() {
            if (filterOverlay) {
                filterOverlay.classList.remove('is-open');
                filterOverlay.setAttribute('aria-hidden', 'true');
                if (navFilterBtn) {
                    navFilterBtn.classList.remove('is-active');
                    navFilterBtn.setAttribute('aria-expanded', 'false');
                }
                document.body.classList.remove('filter-modal-locked');
                setTimeout(() => {
                    if (filterOverlay && !filterOverlay.classList.contains('is-open')) {
                        filterOverlay.style.display = 'none';
                    }
                }, 260);
            }
        }

        if (navFilterBtn) {
            navFilterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (filterOverlay && filterOverlay.classList.contains('is-open')) {
                    closeFilterModal();
                } else {
                    openFilterModal();
                }
            });
        }

        if (mobileFilterBtn) {
            mobileFilterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openFilterModal();
            });
        }

        if (pageFilterBtn) {
            pageFilterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openFilterModal();
            });
        }

        if (filterBackdrop) filterBackdrop.addEventListener('click', closeFilterModal);
        if (filterCloseBtn) filterCloseBtn.addEventListener('click', closeFilterModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && filterOverlay && filterOverlay.classList.contains('is-open')) {
                closeFilterModal();
            }
        });
    </script>
</body>
</html>
