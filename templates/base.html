{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} | {% endif %}N-IT Home — PC Hardware Components</title>
    <meta name="description" content="N-IT Home is a full-stack PC hardware e-commerce platform offering top-tier RAM, SSDs, CPUs, and GPUs with instant delivery and secure payments.">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/gallery.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>
    <!-- Hidden Checkbox for Zero-JS Mobile Navigation Toggle -->
    <input type="checkbox" id="mobile-nav-toggle" aria-hidden="true">

    <!-- Global Navigation Header -->
    {% include 'includes/navbar.html' %}

    <!-- Main Container Content -->
    <main class="main-content">
        <div class="container">
            {% include 'includes/messages.html' %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Global Footer -->
    {% include 'includes/footer.html' %}
</body>
</html>
