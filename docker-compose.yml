# Docker Compose configuration for N-IT HOME E-Commerce Platform
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nit-store:latest
    container_name: nit-store-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - PORT=8000
      - SITE_URL=http://localhost:8000
    volumes:
      # Persistent customer media uploads
      - ./media:/app/media
      # Local persistent SQLite database file
      - ./db.sqlite3:/app/db.sqlite3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
